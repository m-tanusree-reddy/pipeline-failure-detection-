version: '3.8'

services:
  # 1. Production PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pipeline_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pipeline_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-pipeline_db}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline_user -d pipeline_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Message Broker & Result Cache
  redis:
    image: redis:7-alpine
    container_name: pipeline_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. FastAPI Webhook & API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pipeline_api
    restart: always
    command: >
      sh -c "alembic upgrade head &&
             uvicorn backend.server:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://pipeline_user:pipeline_secure_pass@postgres:5432/pipeline_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - TASK_QUEUE_MODE=celery
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Celery Distributed Background Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pipeline_worker
    restart: always
    command: celery -A backend.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql://pipeline_user:pipeline_secure_pass@postgres:5432/pipeline_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
